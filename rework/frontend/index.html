<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rework — 리버스 엔지니어링 워크벤치</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1522'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%2360a5fa' text-anchor='middle'%3Er%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body data-theme="dark">
<div id="app">
  <!-- 타이틀 바 -->
  <header id="titlebar">
    <div class="tb-left">
      <span class="logo">re<span class="logo-accent">work</span></span>
      <span id="file-name" class="file-name">열린 파일 없음</span>
      <span id="file-meta" class="file-meta"></span>
    </div>
    <div class="tb-right">
      <button class="tb-btn" data-cmd="palette" title="명령 팔레트 (Ctrl+K)">⌘ 명령</button>
      <button class="tb-btn" data-cmd="toggle-theme" title="테마 전환">◐</button>
    </div>
  </header>

  <div id="body">
    <!-- 액티비티 바 -->
    <nav id="activitybar">
      <button class="act" data-view="open"    title="열기"></button>
      <button class="act" data-view="explorer" title="탐색기 · 작업 폴더 (Ctrl+Shift+E)"></button>
      <button class="act active" data-view="functions" title="함수 (Alt 1)"></button>
      <button class="act" data-view="strings" title="문자열 (Alt 2)"></button>
      <button class="act" data-view="symbols" title="심볼 (Alt 3)"></button>
      <button class="act" data-view="imports" title="임포트/익스포트 (Alt 4)"></button>
      <button class="act" data-view="bookmarks" title="북마크 (Alt 5)"></button>
      <button class="act" data-view="debug" title="디버그 (동적 분석)"></button>
      <button class="act" data-view="script" title="스크립트 콘솔"></button>
      <div class="act-spacer"></div>
      <button class="act" data-cmd="toggle-ai" title="AI 채팅 (Ctrl+Shift+A)"></button>
      <button class="act" data-view="settings" title="설정"></button>
    </nav>

    <!-- 사이드바 -->
    <aside id="sidebar">
      <div class="side-head"><span id="side-title">함수</span>
        <span id="side-count" class="side-count"></span></div>
      <div id="side-body"></div>
    </aside>
    <div class="splitter" id="split-side"></div>

    <!-- 메인 에디터 영역 -->
    <main id="main">
      <div id="tabs"></div>
      <div id="editor"><div class="empty-state">
        <div class="es-big">rework</div>
        <div class="es-sub">리버스 엔지니어링 워크벤치</div>
        <div class="es-hint">왼쪽 <b>열기</b>에서 바이너리를 선택하거나,<br>
          <kbd>Ctrl</kbd>+<kbd>K</kbd> 로 명령 팔레트를 여세요.</div>
      </div></div>
      <div class="splitter-h" id="split-bottom"></div>
      <!-- 하단 패널 -->
      <section id="bottom">
        <div class="panel-tabs">
          <button class="ptab active" data-panel="xrefs">상호참조</button>
          <button class="ptab" data-panel="output">출력</button>
          <button class="ptab" data-panel="run">빌드·테스트</button>
          <button class="ptab" data-panel="debugcon">디버그 콘솔</button>
        </div>
        <div class="panel-body">
          <div class="panel active" data-panel="xrefs" id="panel-xrefs"></div>
          <div class="panel" data-panel="output" id="panel-output"></div>
          <div class="panel" data-panel="run" id="panel-run"></div>
          <div class="panel" data-panel="debugcon" id="panel-debugcon"></div>
        </div>
      </section>
    </main>

    <!-- 오른쪽 AI 패널 -->
    <div class="splitter" id="split-ai"></div>
    <aside id="aipanel" class="hidden">
      <div class="side-head">AI 분석 도우미
        <button class="mini-btn" id="ai-settings-btn" title="AI 설정">⚙</button>
      </div>
      <div id="ai-messages"></div>
      <div id="ai-input-wrap">
        <label class="ai-attach"><input type="checkbox" id="ai-attach-fn" checked> 현재 함수 의사코드 첨부</label>
        <div class="ai-row">
          <textarea id="ai-input" rows="2" placeholder="이 함수가 무슨 일을 하나요? (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
          <button id="ai-send" class="primary">전송</button>
        </div>
        <div id="ai-status" class="ai-status"></div>
      </div>
    </aside>
  </div>

  <!-- 상태 바 -->
  <footer id="statusbar">
    <span id="sb-arch"></span>
    <span id="sb-addr"></span>
    <span id="sb-ed"></span>
    <span class="sb-spacer"></span>
    <span id="sb-msg"></span>
  </footer>
</div>

<!-- 명령 팔레트 -->
<div id="palette" class="overlay hidden">
  <div class="palette-box">
    <input id="palette-input" type="text" autocomplete="off"
           placeholder="명령(>)·함수(@)·주소(0x…) 검색">
    <ul id="palette-list"></ul>
    <div class="palette-foot">Enter 실행 · Esc 닫기 · <b>&gt;</b> 명령 · <b>@</b> 함수</div>
  </div>
</div>

<!-- 범용 모달(입력/확인) -->
<div id="modal" class="overlay hidden">
  <div class="modal-box">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-foot">
      <button id="modal-cancel">취소</button>
      <button id="modal-ok" class="primary">확인</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>

/* ======================================================================
   단서 — OSINT 수사 노트 (단일 HTML 파일, 오프라인, 외부 요청 없음)
   ====================================================================== */
:root{
  /* Layout: 사건 파일 라이트테이블 — 왼쪽 스파인(사건 선택·탐색), 오른쪽 작업면.
     셀렉터·시각은 모노, 서술은 산세리프, 추출된 셀렉터에는 형광펜 밑줄 */
  --bg:#E9EDEF; --side-bg:#DEE4E7; --surface:#F8FAFA; --surface-2:#EFF2F3; --surface-3:#E3E8EA;
  --line:#D3DADE; --line-strong:#B5C0C6;
  --fg:#142028; --fg-2:#34444E; --muted:#5F6E78; --faint:#78858E;
  --accent:#0B6E69; --accent-strong:#085550; --accent-fg:#FFFFFF; --accent-soft:rgba(11,110,105,.12);
  --mark:rgba(250,204,21,.48); --mark-line:rgba(161,98,7,.65);
  --danger:#B42318; --danger-soft:rgba(180,35,24,.10);
  --warn:#9A5B05; --warn-soft:rgba(202,128,10,.15);
  --ok:#17784C; --ok-soft:rgba(23,120,76,.12);
  --overlay:rgba(12,20,26,.45);
  --shadow:0 1px 2px rgba(20,32,40,.06),0 6px 20px rgba(20,32,40,.08);
  --shadow-lg:0 18px 50px rgba(10,20,28,.28);
  --t-person:#C2410C; --t-organization:#7C3AED; --t-username:#0369A1; --t-email:#BE185D;
  --t-phone:#15803D; --t-domain:#1D4ED8; --t-ip:#4338CA; --t-url:#0F766E; --t-crypto:#A16207;
  --t-location:#B91C1C; --t-hash:#4D7C0F; --t-vehicle:#92400E; --t-document:#475569; --t-other:#6B7280;
  --tlp-ink:#000000; --tlp-red:#FF2B2B; --tlp-amber:#FFC000; --tlp-green:#33FF00; --tlp-clear:#FFFFFF;
  --font-sans:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"D2Coding","JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --r-sm:4px; --r:6px; --r-lg:10px;
  --side-w:244px; --top-h:52px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1215; --side-bg:#090D0F; --surface:#141A1E; --surface-2:#192126; --surface-3:#202A30;
    --line:#252F36; --line-strong:#36454E;
    --fg:#DCE4E8; --fg-2:#B4C0C7; --muted:#87959D; --faint:#5F6D75;
    --accent:#45C4B6; --accent-strong:#73DACF; --accent-fg:#04201D; --accent-soft:rgba(69,196,182,.14);
    --mark:rgba(250,204,21,.22); --mark-line:rgba(250,204,21,.55);
    --danger:#F97066; --danger-soft:rgba(249,112,102,.14);
    --warn:#F5B544; --warn-soft:rgba(245,181,68,.14);
    --ok:#4FD18F; --ok-soft:rgba(79,209,143,.13);
    --overlay:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 20px 60px rgba(0,0,0,.65);
    --t-person:#FB923C; --t-organization:#A78BFA; --t-username:#38BDF8; --t-email:#F472B6;
    --t-phone:#4ADE80; --t-domain:#60A5FA; --t-ip:#818CF8; --t-url:#2DD4BF; --t-crypto:#FACC15;
    --t-location:#F87171; --t-hash:#A3E635; --t-vehicle:#D6A26B; --t-document:#94A3B8; --t-other:#9CA3AF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1215; --side-bg:#090D0F; --surface:#141A1E; --surface-2:#192126; --surface-3:#202A30;
  --line:#252F36; --line-strong:#36454E;
  --fg:#DCE4E8; --fg-2:#B4C0C7; --muted:#87959D; --faint:#5F6D75;
  --accent:#45C4B6; --accent-strong:#73DACF; --accent-fg:#04201D; --accent-soft:rgba(69,196,182,.14);
  --mark:rgba(250,204,21,.22); --mark-line:rgba(250,204,21,.55);
  --danger:#F97066; --danger-soft:rgba(249,112,102,.14);
  --warn:#F5B544; --warn-soft:rgba(245,181,68,.14);
  --ok:#4FD18F; --ok-soft:rgba(79,209,143,.13);
  --overlay:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.65);
  --t-person:#FB923C; --t-organization:#A78BFA; --t-username:#38BDF8; --t-email:#F472B6;
  --t-phone:#4ADE80; --t-domain:#60A5FA; --t-ip:#818CF8; --t-url:#2DD4BF; --t-crypto:#FACC15;
  --t-location:#F87171; --t-hash:#A3E635; --t-vehicle:#D6A26B; --t-document:#94A3B8; --t-other:#9CA3AF;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.break{overflow-wrap:anywhere;word-break:break-word}
.grow{flex:1;min-width:0}
.ico{display:inline-flex;flex:none;line-height:0}
.ico svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.sp{flex:1}
.kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--fg-2);white-space:nowrap}
.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--fg);border-radius:var(--r);font-size:13px;font-weight:550;white-space:nowrap;text-decoration:none;
  transition:background .12s,border-color .12s,color .12s;flex:none;line-height:1}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{height:26px;padding:0 8px;font-size:12px;gap:4px}
.btn.xs{height:22px;padding:0 6px;font-size:11.5px;gap:4px;border-radius:var(--r-sm)}
.btn.icon{width:32px;padding:0}
.btn.icon.sm{width:26px}
.btn.icon.xs{width:22px}
.btn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0}
.btn-group .btn+.btn{margin-left:-1px}
.btn-group .btn:first-child{border-radius:var(--r) 0 0 var(--r)}
.btn-group .btn:last-child{border-radius:0 var(--r) var(--r) 0}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

/* ---------- form ---------- */
.input,.select,.textarea{width:100%;min-width:0;height:34px;padding:0 10px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r);color:var(--fg);outline:none;transition:border-color .12s,box-shadow .12s}
.select{padding-right:6px}
.textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.sm,.select.sm{height:28px;font-size:12.5px;padding:0 8px}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>.lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.show-sm{display:none}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px}
.check input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:34px;height:20px;border-radius:10px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.trk{background:var(--accent)}
.switch input:checked+.trk::after{transform:translateX(14px)}
.switch input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.searchbox{position:relative;display:flex;align-items:center;min-width:0}
.searchbox .ico{position:absolute;left:9px;color:var(--faint);pointer-events:none}
.searchbox .input{padding-left:30px}

/* ---------- badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r-sm);font-size:11px;font-weight:650;
  white-space:nowrap;background:var(--surface-3);color:var(--fg-2);letter-spacing:.01em;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.badge.outline{background:transparent;border:1px solid var(--line-strong)}
.etype{--c:var(--t-other);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
[data-t=person]{--c:var(--t-person)} [data-t=organization]{--c:var(--t-organization)} [data-t=username]{--c:var(--t-username)}
[data-t=email]{--c:var(--t-email)} [data-t=phone]{--c:var(--t-phone)} [data-t=domain]{--c:var(--t-domain)} [data-t=ip]{--c:var(--t-ip)}
[data-t=url]{--c:var(--t-url)} [data-t=crypto]{--c:var(--t-crypto)} [data-t=location]{--c:var(--t-location)} [data-t=hash]{--c:var(--t-hash)}
[data-t=vehicle]{--c:var(--t-vehicle)} [data-t=document]{--c:var(--t-document)} [data-t=other]{--c:var(--t-other)}
.tdot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--t-other));flex:none;display:inline-block}
.tlp{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:2px;background:var(--tlp-ink);color:var(--tlp-clear);
  font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.05em;white-space:nowrap;flex:none}
.tlp[data-tlp=RED]{color:var(--tlp-red)} .tlp[data-tlp=AMBER],.tlp[data-tlp="AMBER+STRICT"]{color:var(--tlp-amber)}
.tlp[data-tlp=GREEN]{color:var(--tlp-green)} .tlp[data-tlp=CLEAR]{color:var(--tlp-clear)}
.adm{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:20px;padding:0 5px;border-radius:var(--r-sm);
  font-family:var(--font-mono);font-size:11.5px;font-weight:700;border:1px solid currentColor;flex:none}
.adm.q-good{color:var(--ok)} .adm.q-mid{color:var(--warn)} .adm.q-bad{color:var(--danger)} .adm.q-unk{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:10px;border:1px solid var(--line-strong);
  color:var(--fg-2);font-size:11.5px;white-space:nowrap;background:var(--surface);flex:none}
.tag button{border:0;background:none;padding:0;margin-left:2px;color:var(--muted);line-height:0}
.tags{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:24px;padding:0 8px 0 6px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);font-size:12px;color:var(--fg);cursor:pointer;min-width:0}
.chip:hover{border-color:var(--line-strong);background:var(--surface-3)}
.chip .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.conf{font-size:11px;font-weight:650;white-space:nowrap}
.conf.high{color:var(--ok)} .conf.mid{color:var(--warn)} .conf.low{color:var(--danger)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.status-dot.ok{background:var(--ok)} .status-dot.warn{background:var(--warn)} .status-dot.danger{background:var(--danger)} .status-dot.busy{background:var(--accent);animation:pulse 1s infinite}

/* ---------- app shell ---------- */
#app{height:100%}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%}
.side{background:var(--side-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand-sub{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin-top:3px}
.case-switch{margin:4px 10px 8px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface);text-align:left;width:calc(100% - 20px);min-width:0}
.case-switch:hover{border-color:var(--faint)}
.case-switch .cs-t{font-weight:650;font-size:13px;line-height:1.25}
.case-switch .cs-s{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px;overflow-y:auto;min-height:0;flex:1}
.nav-sec{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--faint);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:0 10px;height:34px;border-radius:var(--r);color:var(--fg-2);text-decoration:none;font-size:13.5px;font-weight:550;position:relative}
.nav a:hover{background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg)}
.nav a.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.nav a.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted)}
.side-foot .row{gap:6px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.main::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tlp-c,transparent);z-index:5;pointer-events:none}
.topbar{height:var(--top-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.crumb .ct{font-weight:700;font-size:14.5px;min-width:0}
.crumb .cv{color:var(--muted);font-size:13px;white-space:nowrap}
.searchbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;width:min(300px,34vw);border:1px solid var(--line-strong);border-radius:var(--r);
  background:var(--surface-2);color:var(--faint);font-size:13px;text-align:left}
.searchbtn:hover{border-color:var(--faint);color:var(--muted)}
.searchbtn .sp{flex:1}
.menu-btn{display:none}
.banners{flex:none}
.banner{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--fg)}
.banner.info{background:var(--accent-soft)}
.banner.danger{background:var(--danger-soft)}
.view{flex:1;overflow:auto;padding:22px 26px 56px;min-height:0;position:relative}
.view.fill{padding:0;overflow:hidden;display:flex;flex-direction:column}
.scrim{display:none}

/* ---------- view header & panels ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px}
.vhead h1{margin:2px 0 0;font-size:23px;font-weight:750;letter-spacing:-.015em;line-height:1.2;text-wrap:balance}
.vhead .sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:70ch}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:44px}
.panel-h h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-b{padding:12px 14px}
.panel-b.flush{padding:0}
.section-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty .ico{color:var(--faint)}
.empty h4{margin:0;color:var(--fg);font-size:15px}
.empty p{margin:0;max-width:44ch;font-size:13px;line-height:1.6}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);min-width:0}
.list-item:last-child{border-bottom:0}
.list-item.click{cursor:pointer}
.list-item.click:hover{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:13px;align-items:baseline}
.kv dt{color:var(--muted);font-size:12px;white-space:nowrap}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.out{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  white-space:pre-wrap;overflow-wrap:anywhere;min-height:40px;max-height:420px;overflow:auto}
.codebox{font-family:var(--font-mono);font-size:12.5px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:650;font-size:11px;letter-spacing:.06em;color:var(--muted);padding:8px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--fg)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.tbl tr.click{cursor:pointer}
.tbl td.actions{text-align:right;white-space:nowrap;width:1%}
.tbl .val{font-family:var(--font-mono);font-size:12.5px;max-width:340px;overflow-wrap:anywhere}

/* ---------- overview ---------- */
.ov-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;margin-bottom:18px}
.ov-title{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;border:1px solid transparent;border-radius:var(--r);padding:2px 6px;margin:0 -7px;
  background:transparent;width:100%;outline:none}
.ov-title:hover{border-color:var(--line)}
.ov-title:focus{border-color:var(--accent);background:var(--surface)}
.ov-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat:hover{border-color:var(--line-strong)}
.stat .n{font-family:var(--font-mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ov-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.ov-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.typebar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-3);gap:2px}
.typebar span{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hyp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line)}
.hyp:last-child{border-bottom:0}
.hyp .ht{font-size:13.5px;line-height:1.5}
.hyp .hn{font-size:12px;color:var(--muted);margin-top:2px}
.sample-banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--warn);border-radius:var(--r-lg);
  background:var(--warn-soft);margin-bottom:16px;font-size:13px}

/* ---------- notes ---------- */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);height:100%;min-height:0}
.notes-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.notes-side-h{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.nlist{overflow-y:auto;flex:1;min-height:0}
.nitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;position:relative}
.nitem:hover{background:var(--surface-3)}
.nitem.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.nitem .nt{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.nitem .nt span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .ns{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45;overflow-wrap:anywhere}
.nitem .nm{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:11px;color:var(--faint);flex-wrap:wrap}
.notes-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.ned-h{padding:12px 18px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.note-title{font-size:20px;font-weight:750;border:0;background:transparent;outline:none;padding:2px 0;width:100%;letter-spacing:-.01em}
.ned-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.ned-tb{display:flex;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.ned-tb .btn.ghost{height:28px;min-width:28px;padding:0 6px;font-size:12.5px}
.ned-tb .vsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.ned-body{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ned-body.m-edit{grid-template-columns:1fr}
.ned-body.m-edit .note-preview{display:none}
.ned-body.m-view{grid-template-columns:1fr}
.ned-body.m-view .note-ta{display:none}
.note-ta{width:100%;height:100%;border:0;border-right:1px solid var(--line);resize:none;outline:none;padding:16px 18px 80px;background:var(--surface);
  font-family:var(--font-mono);font-size:13px;line-height:1.7;tab-size:2;color:var(--fg)}
.ned-body.m-edit .note-ta{border-right:0;max-width:none}
.note-preview{overflow-y:auto;padding:16px 22px 80px;min-width:0}
.ned-foot{display:flex;gap:12px;align-items:center;padding:6px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);flex-wrap:wrap;background:var(--surface-2)}
.notes .back-btn{display:none}

/* ---------- markdown ---------- */
.md{line-height:1.72;font-size:14.5px;overflow-wrap:anywhere;color:var(--fg)}
.md>:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.3;margin:1.3em 0 .5em;text-wrap:balance;letter-spacing:-.01em}
.md h1{font-size:1.55em} .md h2{font-size:1.28em;padding-bottom:.3em;border-bottom:1px solid var(--line)} .md h3{font-size:1.1em} .md h4,.md h5,.md h6{font-size:1em}
.md p{margin:.55em 0}
.md code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-3);padding:.12em .38em;border-radius:3px}
.md pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;margin:.8em 0}
.md pre code{background:none;padding:0;font-size:12.5px;line-height:1.6;white-space:pre}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--line-strong);color:var(--fg-2)}
.md table{border-collapse:collapse;margin:.8em 0;font-size:13px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2);font-weight:650}
.md ul,.md ol{padding-left:1.45em;margin:.45em 0}
.md li{margin:.15em 0}
.md li.md-task{list-style:none;position:relative}
.md li.md-task>input{position:absolute;left:-1.35em;top:.45em;margin:0;width:14px;height:14px;accent-color:var(--accent)}
.md li.md-task.done>.tt{color:var(--muted);text-decoration:line-through}
.md hr{border:0;border-top:1px dashed var(--line-strong);margin:1.6em 0}
.md img{max-width:100%;border-radius:var(--r);border:1px solid var(--line);display:block;margin:.6em 0}
.md mark{background:var(--mark);color:inherit;padding:0 .12em;border-radius:2px}
.md del{color:var(--muted)}
.md a{color:var(--accent)}
.md .img-blocked{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border:1px dashed var(--line-strong);border-radius:var(--r);font-size:12px;color:var(--muted)}
.md .att-file{display:inline-flex;gap:6px;align-items:center;padding:2px 8px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;background:var(--surface-2);text-decoration:none}
.md .att-file.missing{border-style:dashed;border-color:var(--warn);color:var(--muted)}
.md .att-missing{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;border:1px dashed var(--warn);border-radius:var(--r);font-size:12px;color:var(--fg-2);background:var(--warn-soft);max-width:100%}
.sel{background:linear-gradient(transparent 58%,var(--mark) 58%);border-bottom:1px dotted var(--mark-line);cursor:pointer;border-radius:1px;padding:0 1px}
.sel:hover{background:var(--mark)}
.sel.known{--c:var(--t-other);background:color-mix(in srgb,var(--c) 14%,transparent);border-bottom:2px solid var(--c)}
.sel.known:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.wl{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer;font-weight:550}
.wl.missing{color:var(--danger);border-bottom-style:dashed}

/* ---------- entities ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:12.5px;color:var(--fg-2)}
.fchip:hover{border-color:var(--line-strong)}
.fchip.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));color:var(--fg)}
.fchip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.ent-v{display:flex;flex-direction:column;gap:1px;min-width:0}
.ent-v .v{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.ent-v .l{font-size:12px;color:var(--muted)}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  z-index:60;display:flex;flex-direction:column;animation:slidein .16s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h .dt{font-family:var(--font-mono);font-size:15px;font-weight:650;overflow-wrap:anywhere;line-height:1.35}
.drawer-b{flex:1;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:18px}
.dsec>h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);display:flex;align-items:center;gap:8px}
.dsec>h4 .sp{flex:1}
.pivots{display:flex;flex-direction:column;gap:10px}
.pv-cat{display:flex;flex-direction:column;gap:5px}
.pv-cat>.c{font-size:11px;color:var(--faint);font-weight:600}
.pv-links{display:flex;flex-wrap:wrap;gap:5px}
.pv{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  font-size:12px;color:var(--fg);text-decoration:none;white-space:nowrap}
.pv:hover{border-color:var(--accent);color:var(--accent)}
.pv .ico{color:var(--faint)}
.rel{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);min-width:0}
.rel .lab{font-size:11.5px;color:var(--muted);white-space:nowrap;font-family:var(--font-mono)}
.mention{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;font-size:12.5px}
.mention:hover{border-color:var(--line-strong)}
.mention .mt{font-weight:650;font-size:12.5px;margin-bottom:2px}
.mention .ms{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.mention .ms b{background:var(--mark);color:var(--fg);font-weight:600}

/* ---------- enrichment ---------- */
.enr-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.enr-card.err{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.enr-h{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.enr-sum{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.enr-kv{font-size:12.5px;gap:3px 12px}
.enr-found{display:flex;flex-wrap:wrap;gap:4px}
.enr-found .chip{height:26px;cursor:pointer}
.enr-found .chip input{margin:0;width:13px;height:13px;accent-color:var(--accent);flex:none}
.enr-raw summary{cursor:pointer;font-size:12px;color:var(--muted)}
.enr-raw .out{margin-top:6px;max-height:260px;font-size:11.5px}
.enr-off{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r)}
.enr-alert{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--warn);margin-bottom:8px}
.prov-group{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:6px;font-family:var(--font-mono)}
.prov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prov:last-child{border-bottom:0}
.prov .pn{font-weight:650;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prov .pd{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.prov .pa{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.prov .key{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.prov .key .input{max-width:320px}
@media (max-width: 560px){.prov{grid-template-columns:auto minmax(0,1fr)}.prov .pa{grid-column:2;align-items:flex-start;flex-direction:row;flex-wrap:wrap}}

/* ---------- graph ---------- */
.graph-wrap{position:relative;flex:1;min-height:0;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--fg) 9%,transparent) 1px,transparent 0) 0 0/22px 22px,var(--surface-2)}
.graph-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.graph-wrap canvas.dragging{cursor:grabbing}
.graph-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.graph-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.graph-info{position:absolute;left:12px;bottom:12px;max-width:min(360px,calc(100% - 80px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.graph-hint{position:absolute;left:12px;top:12px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:var(--r);pointer-events:none}
.graph-legend{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);max-height:calc(100% - 100px);overflow:auto}
.graph-legend button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;font-size:11.5px;color:var(--fg-2);text-align:left}
.graph-legend button.off{opacity:.38}
.graph-legend .lg-h{font-weight:650;color:var(--fg);justify-content:space-between;gap:10px}
.graph-legend.collapsed .lg-b{display:none}
.graph-legend .lg-b{display:flex;flex-direction:column;gap:3px}

/* ---------- timeline ---------- */
.hist{width:100%;height:64px;display:block}
.tl{position:relative;margin-left:8px}
.tl-day{margin:0 0 6px;padding:18px 0 6px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--fg-2);letter-spacing:.04em;
  position:sticky;top:-22px;background:var(--bg);z-index:2;display:flex;align-items:center;gap:10px}
.tl-day .dow{color:var(--muted);font-weight:500}
.tl-day::after{content:"";flex:1;height:1px;background:var(--line)}
.tl-ev{display:grid;grid-template-columns:76px 18px minmax(0,1fr);gap:0 10px;position:relative;padding-bottom:10px}
.tl-ev .tm{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:right;padding-top:10px;font-variant-numeric:tabular-nums}
.tl-ev .rail{position:relative;display:flex;justify-content:center}
.tl-ev .rail::before{content:"";position:absolute;top:0;bottom:-10px;width:2px;background:var(--line)}
.tl-ev:last-child .rail::before{bottom:0}
.tl-ev .dot{position:relative;margin-top:12px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);z-index:1}
.tl-ev.c-probable .dot{border-style:solid;border-color:var(--warn)}
.tl-ev.c-unverified .dot{border-style:dashed;border-color:var(--muted)}
.tl-ev.src .dot{border-radius:2px;border-color:var(--faint);width:10px;height:10px;margin-top:13px}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-ev.src .tl-card{background:transparent;border-style:dashed}
.tl-card .tt{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-card .td{font-size:13px;color:var(--fg-2);overflow-wrap:anywhere}

/* ---------- tasks ---------- */
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.task .tx{flex:1;min-width:0;font-size:13.5px;overflow-wrap:anywhere;outline:none;border-radius:3px;padding:0 2px}
.task .tx:focus{background:var(--surface-2)}
.task.done .tx{color:var(--muted);text-decoration:line-through}
.prio{font-size:10.5px;font-weight:700;font-family:var(--font-mono);padding:1px 5px;border-radius:3px;flex:none;margin-top:2px;border:0;cursor:pointer}
.prio.p1{background:var(--danger-soft);color:var(--danger)} .prio.p2{background:var(--surface-3);color:var(--muted)} .prio.p3{background:transparent;color:var(--faint)}

/* ---------- log ---------- */
.log-row{display:grid;grid-template-columns:150px 74px minmax(0,1fr);gap:10px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.log-row:last-child{border-bottom:0}
.log-row .lt{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log-row .lm{overflow-wrap:anywhere}
.lk{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;text-align:center;font-family:var(--font-mono);letter-spacing:.03em;justify-self:start}

  align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}

}

/* ======================================================================
   2. 오버레이 · 토스트 · 모달 · 메뉴 (alert/confirm/prompt 대신 페이지 내 UI)
   ====================================================================== */
const OVL = [];
const pushOverlay = (o) => OVL.push(o);
const popOverlay = (o) => { const i = OVL.indexOf(o); if (i >= 0) OVL.splice(i, 1); };
function closeTopOverlay() { const o = OVL[OVL.length - 1]; if (o) { o.close(); return true; } return false; }

function toast(msg, { err = false, action, actionLabel = '되돌리기', timeout = 2600 } = {}) {
  const box = $('#toasts');
  if (!box) return;
  const t = h('div', { class: 'toast' + (err ? ' err' : ''), role: err ? 'alert' : 'status' }, h('span', null, msg));
  if (action) t.append(h('button', { onclick: () => { t.remove(); action(); } }, actionLabel));
  box.append(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.remove(), action ? Math.max(timeout, 7000) : timeout);
}

function trapTab(e, box) {
  const f = $$('button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])', box).filter((x) => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function modal({ title, body, foot, wide, narrow, onClose, ic, sticky = false, cls = '' }) {
  closePop();
  const prevFocus = document.activeElement;
  const ovl = h('div', { class: 'ovl' });
  const box = h('div', { class: 'modal' + (wide ? ' wide' : '') + (narrow ? ' narrow' : '') + (cls ? ' ' + cls : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  const closeBtn = h('button', { class: 'btn ghost icon sm', 'aria-label': '닫기', title: '닫기 (Esc)', onclick: () => close() }, icon('x'));
  const bodyEl = h('div', { class: 'modal-b' }, body);
  const footEl = foot ? h('div', { class: 'modal-f' }, foot) : null;
  box.append(h('div', { class: 'modal-h' }, ic ? icon(ic, 18) : null, h('h2', null, title), closeBtn), bodyEl);
  if (footEl) box.append(footEl);
  ovl.append(box);
  let closed = false;
  const o = { el: box, ovl, body: bodyEl, foot: footEl, close, modal: true };
  function close(result) {
    if (closed) return;
    closed = true;
    ovl.remove();
    popOverlay(o);
    try { onClose?.(result); } finally { try { prevFocus?.focus?.({ preventScroll: true }); } catch (e) { /* noop */ } }
  }
  let downOnOvl = false;
  ovl.addEventListener('mousedown', (e) => { downOnOvl = e.target === ovl; });
  ovl.addEventListener('click', (e) => { if (!sticky && e.target === ovl && downOnOvl) close(); downOnOvl = false; });
  box.addEventListener('keydown', (e) => { if (e.key === 'Tab') trapTab(e, box); });
  document.body.append(ovl);
  pushOverlay(o);
  requestAnimationFrame(() => {
    const f = box.querySelector('[autofocus]') || box.querySelector('.modal-b input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=file]):not([disabled]), .modal-b textarea, .modal-b select');
    (f || box.querySelector('.modal-f .btn.primary') || closeBtn).focus({ preventScroll: true });
  });
  return o;
}

function confirmDialog(message, { title = '확인', ok = '확인', cancel = '취소', danger = false, typeToConfirm = null, detail = null } = {}) {
  return new Promise((resolve) => {
    let input = null;
    const okBtn = h('button', { class: 'btn ' + (danger ? 'danger solid' : 'primary'), onclick: () => m.close(true) }, ok);
    const body = [h('p', { style: 'margin:0;line-height:1.65' }, message)];
    if (detail) body.push(detail);
    if (typeToConfirm) {
      input = h('input', { class: 'input', placeholder: typeToConfirm, autocomplete: 'off',
        oninput: () => { okBtn.disabled = input.value.trim() !== typeToConfirm; },
        onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing && !okBtn.disabled) m.close(true); } });
      okBtn.disabled = true;
      body.push(h('label', { class: 'field' }, h('span', { class: 'lbl' }, `계속하려면 “${typeToConfirm}”을(를) 입력하세요`), input));
    }
    const m = modal({ title, narrow: true, body, foot: [h('button', { class: 'btn', onclick: () => m.close(false) }, cancel), okBtn], onClose: (r) => resolve(r === true) });
    if (!typeToConfirm) setTimeout(() => okBtn.focus(), 40);
  });
}

function promptDialog({ title, label, value = '', placeholder = '', multiline = false, ok = '확인', mono = false, hint = null, type = 'text' }) {
  return new Promise((resolve) => {
    const cls = (multiline ? 'textarea' : 'input') + (mono ? ' mono' : '');
    const inp = multiline ? h('textarea', { class: cls, rows: 5, placeholder }) : h('input', { class: cls, placeholder, type, autocomplete: 'off' });
    inp.value = value;
    const submit = () => m.close(inp.value);
    inp.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter' && (!multiline || e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); }
    });
    const m = modal({ title, narrow: !multiline, body: [h('label', { class: 'field' }, label ? h('span', { class: 'lbl' }, label) : null, inp), hint ? h('div', { class: 'hint' }, hint) : null],
      foot: [h('button', { class: 'btn', onclick: () => m.close(null) }, '취소'), h('button', { class: 'btn primary', onclick: submit }, ok)],
      onClose: (r) => resolve(typeof r === 'string' ? r : null) });
    setTimeout(() => { inp.focus(); inp.select?.(); }, 40);
  });
}

let _pop = null;
function closePop() { if (_pop) _pop.close(); }
function placePop(el, anchor) {
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y };
  const vw = window.innerWidth, vh = window.innerHeight;
  const pw = el.offsetWidth, ph = el.offsetHeight;
  let x = r.left, y = r.bottom + 4;
  if (x + pw > vw - 8) x = Math.max(8, Math.min(r.right, vw - 8) - pw);
  if (y + ph > vh - 8) y = Math.max(8, r.top - ph - 4);
  el.style.left = Math.round(x) + 'px';
  el.style.top = Math.round(y) + 'px';
}
function popMenu(anchor, items, { cls = '' } = {}) {
  closePop();
  const el = h('div', { class: 'pop' + (cls ? ' ' + cls : ''), role: 'menu' });
  for (const it of items) {
    if (!it) continue;
    if (it.sep) { el.append(h('div', { class: 'msep' })); continue; }
    if (it.header) { el.append(h('div', { class: 'mh' }, it.header)); continue; }
    if (it.node) { el.append(it.node); continue; }

const PHISH_LIST = ['OpenPhish 피싱 URL', 'https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt'];
function parseNetset(text) {
  const st = [], en = [];
  let date = '';
  for (const line of text.split('\n')) {
    const l = line.trim();
    if (!l) continue;
    if (l[0] === '#') { const m = /^#\s*Source File Date:\s*(.+)$/i.exec(l); if (m) date = m[1].trim(); continue; }
    const m = /^(\d{1,3}(?:\.\d{1,3}){3})(?:\/(\d{1,2}))?/.exec(l);
    if (!m || !isV4(m[1])) continue;
    const bits = m[2] ? +m[2] : 32;
    const base = v4num(m[1]);
    const size = 2 ** (32 - bits);
    const s = Math.floor(base / size) * size;
    st.push(s); en.push(s + size - 1);
  }
  return { st: Float64Array.from(st), en: Float64Array.from(en), n: st.length, date };
}

// 첨부 요청에 응답: 요청 파일이면 응답 파일(선택 시 암호화)을, 직접 연결(live: 다른 주소의 창·다른 컴퓨터)이면 그 통로로 보낸다
async function attRespondModal(reqRaw, { live = null } = {}) {
  const req = normalizeAttRequest(reqRaw);
  const found = await findForRequest(req.items);
  const avail = found.filter((f) => f.local);
  const chosen = new Set(avail);
  let sent = false;

  const pass = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', placeholder: HAS_SUBTLE ? '응답 파일 비밀번호 (선택 · 비우면 암호화하지 않음)' : '이 주소에서는 응답 파일을 암호화할 수 없음 (보안 컨텍스트 아님)', disabled: !HAS_SUBTLE });
  const err = h('div', { class: 'hint', style: 'color:var(--danger)' });
  const who = req.from ? `${req.from}님이` : '상대가';
  const body = [
    live ? h('p', { style: 'margin:0;line-height:1.6' }, `요청한 곳: ${live.who}${req.from ? ` · ${req.from}` : ''}`, h('br'), `첨부 ${req.items.length}개를 요청합니다. 이 브라우저에서 ${avail.length}개를 찾았습니다.`)
      : h('p', { style: 'margin:0;line-height:1.6' }, `${who} 첨부 ${req.items.length}개를 요청했습니다${req.case ? ` (사건 “${req.case}”)` : ''}. 이 브라우저에서 ${avail.length}개를 찾았습니다.`),
    live ? codeRow(live.code) : null,
    req.items.length ? attTable(found, [
      { t: '', v: (f) => h('input', { type: 'checkbox', checked: !!f.local, disabled: !f.local, 'aria-label': '보낼 첨부', onchange: (e) => { if (e.target.checked) chosen.add(f); else chosen.delete(f); btn.disabled = !chosen.size; } }) },
      { t: '첨부', v: (f) => f.meta?.name || f.name || h('span', { class: 'muted' }, '(이름 모름)') },
      { t: '크기', cls: 'nowrap small', v: (f) => fmtBytes(f.meta?.size || f.size || null) },
      { t: 'SHA-256', cls: 'mono small', v: (f) => { const s = f.sha256 || f.meta?.sha256 || ''; return s ? s.slice(0, 16) + '…' : '—'; } },
      { t: '', v: (f) => h('span', { class: 'badge' + (f.local ? ' ok' : '') }, f.local ? '있음' : '없음') }]) : h('div', { class: 'hint' }, '요청에 첨부 항목이 없습니다.'),
    h('div', { class: 'hint' }, '요청에 적힌 SHA-256(해시를 모르는 항목은 같은 ID)과 맞는 첨부만 보낼 수 있습니다. 노트·엔티티 등 사건 내용은 보내지 않습니다.'),
    live ? h('div', { class: 'hint' }, `양쪽 화면의 확인 코드가 같은지 확인하세요. 내가 연 상대가 아니면 거절하세요. ${live.secureNote}`) : pass,
    err];
  btn.addEventListener('click', async () => {
    const pick = found.filter((f) => chosen.has(f));
    if (!pick.length) return;
    if (!live && pass.value && pass.value.length < 8) { err.textContent = '비밀번호는 8자 이상으로 정하세요.'; return; }
    btn.disabled = true;
    err.textContent = '';
    try {
      const atts = await buildAttResponse(pick);
      const n = Object.keys(atts).length;
      if (live) await peerSend(live, { attachments: atts });
      else {
        const bundle = { format: 'danseo-att-bundle', version: 1, app: 'danseo', requestId: req.requestId, exportedAt: nowISO(), attachments: atts };
        const data = pass.value && HAS_SUBTLE ? await encryptExport(bundle, pass.value) : bundle;
        download(`danseo_attachments_${fmtDT(new Date(), { time: false })}${pass.value ? '.enc' : ''}.json`, JSON.stringify(data), 'application/json');
      }
      sent = true;
      const c = C();
      if (c) { addLog(c, 'system', `첨부 요청에 응답 · ${n}개를 ${live ? `${live.who}(으)로 보냄` : '응답 파일로 내보냄'}${req.from ? ` · 요청자 ${req.from}` : ''}`); markDirty(); }
      m.close('sent');
      toast(live ? `첨부 ${n}개를 보냈습니다` : `응답 파일을 만들었습니다 (첨부 ${n}개). 요청한 사람에게 보내세요.`, { timeout: 4000 });
    } catch (e) { err.textContent = '실패: ' + (e.message || e); btn.disabled = false; }
  });
  const m = modal({ title: live ? '직접 연결로 온 첨부 요청' : '첨부 요청에 응답', ic: 'clip', wide: true, sticky: !!live, body,
    foot: [h('button', { class: 'btn', onclick: () => m.close() }, live ? '거절' : '닫기'), btn],
    onClose: () => { if (live && !sent && !live.cancelled) peerDeny(live); } });
  if (live) live.close = () => m.close('cancelled');
}

/* ---------- 다른 단서와 직접 주고받기 (서버 없음) ----------
   두 통로를 같은 요청·승인 절차로 쓴다. 어느 쪽이든 보내는 쪽 사용자가 확인 코드를 보고 승인해야 보낸다.
   (가) 같은 컴퓨터의 다른 주소: 요청하는 창이 예전 주소를 window.open으로 열고 postMessage로 요청한다. 열린 창은 자기를 연 창
        (window.opener)의 요청만 받는다. 둘 다 보안 컨텍스트면 요청마다 새 ECDH P-256 키로 AES-GCM 암호화해, 그 사이 요청 창이
        다른 페이지로 바뀌어도 내용을 읽을 수 없다. 한쪽이 보안 컨텍스트가 아니면(http://IP 주소로 연 경우) 정확한 origin으로만
        평문을 보내고, 대상을 특정할 수 없는 file:// 창에는 보내지 않는다.
   (나) 다른 컴퓨터(다른 IP): WebRTC 데이터 채널. 연결 코드·응답 코드(SDP)를 메신저 등으로 직접 주고받아(시그널링 서버 없음) 잇고,
        내용은 DTLS로 암호화된다. 확인 코드는 양쪽 DTLS 인증서 지문으로 만들어, 코드를 중간에서 바꿔치기하면 두 화면의 코드가 달라진다. */
const PEER = { seen: new Set(), pending: null };
// 요청한 쪽: 받은 내용 처리 — 첨부는 해시 확인 후 빈 자리만, 전체 데이터는 백업 가져오기와 같은 절차(합치기/바꾸기 선택)
async function peerReceived(kind, payload, from) {
  if (kind === 'atts') {
    const r = await fillMissingFrom(attEntriesFromMap(payload?.attachments));
    const c = C();
    if (c) { addLog(c, 'system', `${from}에서 첨부 받음 · ${r.filled}개`); markDirty(); }
    fillToast(r);
  } else await importData(payload, from);
}
async function peerSend(p, payload) {
  await p.send(payload);
  if (PEER.pending === p) PEER.pending = null;
}
function peerDeny(p, reason = '') {
  p.reply({ type: 'danseo-peer-deny', reason });
  if (PEER.pending === p) PEER.pending = null;
}
// 받은 요청(공통): 형식 확인 → 받았다고 알림 → 승인 창. t = { reply, send, canSend, who, code, pc? }
function peerIncoming(d, t) {
  if (!['atts', 'backup'].includes(d.kind)) return;
  t.reply({ type: 'danseo-peer-ack' });
  if (PEER.seen.has(d.reqId)) return;
  PEER.seen.add(d.reqId);
  PEER.pending = { reqId: d.reqId, kind: d.kind, req: normalizeAttRequest(d), ...t };
  showPeerRequest();
}
function peerCancelled(reqId, msg) {
  const p = PEER.pending;
  if (!p || p.reqId !== reqId) return;
  p.cancelled = true;
  PEER.pending = null;
  p.close?.();
  toast(msg);
}
function showPeerRequest() {
  const p = PEER.pending;
  if (!p || p.shown) return;
  if (!S.started || !S.db) { if (S.locked) toast('다른 단서가 데이터를 요청했습니다. 잠금을 풀면 확인할 수 있습니다.', { timeout: 6000 }); return; }
  if (!p.canSend) { peerDeny(p, 'insecure'); return; }
  p.shown = true;
  if (p.kind === 'atts') attRespondModal(p.req, { live: p });
  else peerBackupModal(p);
}
function peerBackupModal(p) {
  let sent = false;
  const btn = h('button', { class: 'btn primary' }, icon('right', 14), '보내기');
  const err = h('div', { class: 'hint', style: 'color:var(--danger)' });
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    err.textContent = '';
    try {
      await peerSend(p, await backupObject());
      sent = true;
      for (const c of S.db.cases) addLog(c, 'system', `${p.who}(으)로 전체 데이터 보냄`);
      markDirty();
      m.close('sent');
      toast('전체 데이터를 보냈습니다. 받는 쪽에서 가져오기를 마치세요.', { timeout: 5000 });
    } catch (e) { err.textContent = '실패: ' + (e.message || e); btn.disabled = false; }
  });
  const m = modal({ title: '전체 데이터 요청', ic: 'upload', narrow: true, sticky: true, body: [
    h('p', { style: 'margin:0;line-height:1.6' }, `요청한 곳: ${p.who}`, h('br'), `이 브라우저의 사건 ${S.db.cases.length}개와 첨부 ${Object.keys(S.db.attachments).length}개 전체를 요청합니다. 직접 옮기는 중이 아니라면 거절하세요.`),
    codeRow(p.code),
    h('div', { class: 'hint' }, `양쪽 화면의 확인 코드가 같은지 확인하세요. API 키·TURN 비밀번호는 보내지 않습니다. ${p.secureNote}`), err],
    foot: [h('button', { class: 'btn', onclick: () => m.close() }, '거절'), btn],
    onClose: () => { if (!sent && !p.cancelled) peerDeny(p); } });
  p.close = () => m.close('cancelled');
}

/* ----- (가) 같은 컴퓨터의 다른 주소: window.open + postMessage ----- */
const ECDH_ALG = { name: 'ECDH', namedCurve: 'P-256' };
async function ecdhKey(priv, peerRaw, use) {
  const pub = await crypto.subtle.importKey('raw', peerRaw, ECDH_ALG, false, []);
  return crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, priv, { name: 'AES-GCM', length: 256 }, false, [use]);
}
async function peerRequest(kind, rawUrl, items = []) {
  let u = null;
  try { u = new URL(String(rawUrl || '').trim()); } catch (e) { u = null; }
  if (!u || !['file:', 'http:', 'https:'].includes(u.protocol)) { toast('file:// 또는 http(s):// 로 시작하는 단서 파일 주소를 넣으세요', { err: true }); return; }
  if (u.href.split('#')[0] === location.href.split('#')[0]) { toast('지금 열린 파일과 같은 주소입니다', { err: true }); return; }

async function setEncryption(newPass) {
  const keys = (await KV.keys()).filter((k) => k.startsWith('att:'));
  let newKey = null, meta;
  if (newPass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    newKey = await deriveKey(newPass, salt);
    meta = { v: 1, theme: S.meta?.theme || 'system', enc: true, salt, iter: PBKDF2_ITER, check: await encBytes(newKey, utf8(VERIFIER)), createdAt: nowISO() };
  } else meta = { v: 1, theme: S.meta?.theme || 'system', enc: false };
  const pairs = [];
  for (const k of keys) {
    const rec = await KV.get(k);
    if (!rec) continue;
    const plain = rec.enc ? await decBytes(S.key, rec.data) : rec.data;
    pairs.push([k, { ...rec, enc: !!newKey, data: newKey ? await encBytes(newKey, plain) : plain }]);
  }
  S.db.updatedAt = nowISO();
  const json = JSON.stringify(S.db);
  const dbRec = newKey ? { enc: true, ...(await encBytes(newKey, utf8(json))) } : { enc: false, json };
  pairs.push(['db', dbRec], ['meta', meta]);
  await KV.setMany(pairs);
  S.key = newKey;
  S.meta = meta;
  S.dirty = false;
  S.lastSaved = new Date();
  updateSaveStatus();
}

  try { const key = await deriveKey(pass, S.meta.salt, S.meta.iter); return unutf8(await decBytes(key, S.meta.check)) === VERIFIER; } catch (e) { return false; }
}
